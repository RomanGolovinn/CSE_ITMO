plugins {
    id 'java'
    id 'application' // Добавляем плагин для запуска приложения
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ru.itmo'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation project(':common')
}

test {
    useJUnitPlatform()
}

// Указываем главный класс для запуска через gradle run
application {
    mainClass = 'ClientMain'
    // Форсируем кодировку UTF-8 при запуске JVM
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

// Форсируем кодировку UTF-8 при компиляции кода
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Форсируем кодировку UTF-8 при обработке ресурсов (чтобы .properties не ломались)
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

jar {
    archiveFileName = 'client.jar'
    manifest {
        attributes 'Main-Class': 'ClientMain'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javafx {
    version = "17"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}