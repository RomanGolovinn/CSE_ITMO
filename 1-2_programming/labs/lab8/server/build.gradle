plugins {
    id 'java'
    id 'application' // Добавили плагин для запуска
}

group = 'ru.itmo'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(':common')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'org.flywaydb:flyway-core:9.22.3'
}

test {
    useJUnitPlatform()
}

// Настройка для запуска сервера
application {
    // ВНИМАНИЕ: Если твой ServerMain лежит в пакете (например, io.net),
    // напиши полный путь: mainClass = 'io.net.ServerMain'
    mainClass = 'ServerMain'
}

jar {
    archiveFileName = 'server.jar'
    manifest {
        attributes 'Main-Class': 'ServerMain'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}