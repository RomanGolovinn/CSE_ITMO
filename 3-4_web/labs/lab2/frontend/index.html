<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Лабораторная работа №2</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

<header class="header">

    <h1>Лабораторная работа №2</h1>

    <p class="student-info">
        ФИО:
        <span>Головин Роман</span>

        &nbsp; | &nbsp;

        Группа:
        <span>P3216</span>

        &nbsp; | &nbsp;

        Вариант:
        <span>22603</span>
    </p>

</header>

<main>

    <section class="coordinate-section">

        <h2>Область попадания</h2>

        <div class="canvas-container">

            <canvas
                id="coordinateCanvas"
                width="680"
                height="500">

                Ваш браузер не поддерживает Canvas.

            </canvas>

        </div>

    </section>

    <section class="form-section">

        <h2>Проверка точки</h2>

        <form id="pointForm" novalidate>

            <fieldset class="form-row choice-row">
                <legend>X</legend>
                <div class="choice-group" id="xChoices">
                    <label class="choice-option"><input type="checkbox" name="x" value="-4"> -4</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="-3"> -3</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="-2"> -2</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="-1"> -1</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="0"> 0</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="1"> 1</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="2"> 2</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="3"> 3</label>
                    <label class="choice-option"><input type="checkbox" name="x" value="4"> 4</label>
                </div>
                <small id="xError" class="field-error"></small>
            </fieldset>

            <div class="form-row">

                <label for="y">
                    Y
                </label>

                <input
                    id="y"
                    name="y"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="от -5 до 5"
                >

                <small
                    id="yError"
                    class="field-error">
                </small>

            </div>

            <fieldset class="form-row choice-row">
                <legend>R</legend>
                <div class="choice-group">
                    <label class="choice-option"><input type="radio" name="r" value="1" checked> 1</label>
                    <label class="choice-option"><input type="radio" name="r" value="1.5"> 1.5</label>
                    <label class="choice-option"><input type="radio" name="r" value="2"> 2</label>
                    <label class="choice-option"><input type="radio" name="r" value="2.5"> 2.5</label>
                    <label class="choice-option"><input type="radio" name="r" value="3"> 3</label>
                </div>
                <small
                    id="rError"
                    class="field-error">
                </small>
            </fieldset>

            <button
                type="submit"
                class="submit-button">

                Проверить точку

            </button>

        </form>

        <p
            id="formMessage"
            class="form-message">
        </p>

    </section>

    <section class="results-section">

        <h2>Результаты проверок</h2>

        <div class="table-container">

            <table id="resultsTable">

                <thead>

                    <tr>

                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Дата и время</th>

                    </tr>

                </thead>

                <tbody id="resultsBody">

                </tbody>

            </table>

        </div>

        <button
            id="clearResults"
            type="button"
            class="clear-button">

            Очистить историю

        </button>

    </section>

</main>

<footer class="footer">

    Веб-программирование · Лабораторная работа №2

</footer>

<script src="js/script.js?v=3"></script>

</body>

</html>
